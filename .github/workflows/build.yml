name: Build and Package Qt App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: tar.gz
          - os: windows-latest
            ext: zip
          - os: macos-latest
            ext: zip

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Install Linux system dependencies required by Qt6 Widgets / OpenGL
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libxkbcommon-dev \
          libxcb-cursor0 \
          libxcb-xinerama0

    # Install Qt automatically
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'

    # Configure CMake
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_VERBOSE_MAKEFILE=ON

    # Build the Project
    - name: Build Project
      run: cmake --build build --config Release --verbose

    # Package the deployed app into a ZIP/TAR using CPack
    - name: Package Release
      working-directory: build
      run: cpack -C Release

    # Upload the compressed package to GitHub Actions artifacts
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HelloWorldApp-${{ matrix.os }}
        path: build/HelloWorldApp-*.${{ matrix.ext }}
        if-no-files-found: error
